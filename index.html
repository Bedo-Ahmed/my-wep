<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لولو 💗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styei.css/styel.css">
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <span class="big-heart">💗</span>
      <h1>أهلاً يا لولو</h1>
      <p>اكتبي الباسورد عشان تفتحي المفاجأة</p>

      <form id="loginForm" autocomplete="off">
        <input id="password" type="text" inputmode="numeric" placeholder="ــ / ــ / ــــ" aria-label="الباسورد" required>
        <button class="btn" type="submit">افتحي 💌</button>
        <div class="error" id="error" role="alert"></div>
      </form>
    </div>
  </main>

  <script src="./js/js.js"></script>
</body>
</html>
